schemaVersion: 2.0.0

metadataTest:
  envVars:
    - key: POSTGRES_DB
      value: chinook
  labels:
    - key: org.opencontainers.image.title
      value: chinook-postgres
    - key: org.opencontainers.image.source
      value: https://github.com/builtnoble/chinook-postgres
    - key: org.opencontainers.image.licenses
      value: MIT
  exposedPorts: ["5432"]
  volumes: ["/var/lib/postgresql/data"]
  entrypoint: ["docker-entrypoint.sh"]
  cmd: ["postgres"]

fileExistenceTests:
  - name: seed script is in the init directory
    path: /docker-entrypoint-initdb.d/init.sql
    shouldExist: true
  - name: reset script is installed and executable
    path: /usr/local/bin/chinook-reset
    shouldExist: true
    permissions: "-rwxr-xr-x"
  - name: license is included
    path: /usr/share/licenses/chinook-postgres/LICENSE
    shouldExist: true
  - name: upstream Chinook notice is included
    path: /usr/share/licenses/chinook-postgres/THIRD_PARTY_NOTICES.md
    shouldExist: true

commandTests:
  - name: postgres 16 is installed
    command: postgres
    args: ["--version"]
    expectedOutput: ["PostgreSQL\\) 16\\."]
  - name: psql is available for the reset script
    command: psql
    args: ["--version"]
    expectedOutput: ["PostgreSQL\\) 16\\."]
