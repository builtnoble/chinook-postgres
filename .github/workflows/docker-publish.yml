name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/chinook-postgres

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_IMAGE: chinook-postgres:test
      HADOLINT_IMAGE: hadolint/hadolint:v2.15.1
      TRIVY_IMAGE: aquasec/trivy:0.76.1
      CST_VERSION: v1.22.1
      CST_LINUX_AMD64_SHA256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" < Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install container-structure-test
        run: |
          curl -fsSLo container-structure-test "https://github.com/GoogleContainerTools/container-structure-test/releases/download/${CST_VERSION}/container-structure-test-linux-amd64"
          echo "${CST_LINUX_AMD64_SHA256}  container-structure-test" | sha256sum -c -
          chmod +x container-structure-test

      - name: Run structure tests
        run: ./container-structure-test test --image "$TEST_IMAGE" --config tests/container-structure-test.yaml

      - name: Run smoke test
        run: tests/smoke-test.sh "$TEST_IMAGE" -e POSTGRES_PASSWORD=test

      # Gate on OS packages, which a base image bump can fix. Findings in binaries bundled by the
      # upstream postgres image (e.g. gosu's Go stdlib) are reported below but do not block publishing.
      - name: Scan OS packages for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --pkg-types os --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$TEST_IMAGE"

      - name: Report all other vulnerabilities (non-blocking)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$TEST_IMAGE"

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          # Pushes to main publish a moving "edge" tag; "latest" only moves on a stable v* release tag.
          flavor: |
            latest=false
          tags: |
            type=edge
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
